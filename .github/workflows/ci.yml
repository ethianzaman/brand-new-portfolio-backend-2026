name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cms portfolio backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Cms portfolio backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Runs against an in-memory MongoDB, with Cloudinary and email faked.
      - run: npm test
      - run: npm run build
